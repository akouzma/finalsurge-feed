name: Update Final Surge feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      FINAL_SURGE_URL: ${{ secrets.FINAL_SURGE_URL }}
      PAGE_PATH: ${{ secrets.PAGE_PATH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Final Surge calendar
        run: |
          mkdir -p "$PAGE_PATH"

          curl -fsSL "$FINAL_SURGE_URL" \
            -o "$PAGE_PATH/calendar.txt"

          grep -q "BEGIN:VCALENDAR" \
            "$PAGE_PATH/calendar.txt"

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PAGE_PATH/calendar.txt"

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Final Surge feed"
            git push
          fi
